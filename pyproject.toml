[project]
name = "nine-tails"
version = "0.1.0"
description = "Nine Tails: modular AI companion robot (host, protocol, simulator)"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20", "pyyaml>=6.0", "websockets>=15", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]
stt = ["faster-whisper>=1.0"]
tts = ["kokoro-onnx>=0.4"]
art = ["pillow>=10"]

[tool.setuptools]
packages = ["protocol", "companion", "companion.application", "companion.personality", "companion.scheduling", "companion.security", "companion.memory", "companion.behavior", "companion.tamagotchi", "companion.conversation", "companion.speech", "companion.psychology", "companion.psychology.exercises", "companion.psychology.conflict_navigation", "companion.psychology.growth_plans", "companion.psychology.safety", "companion.psychology.sources", "simulator", "tools"]

[tool.setuptools.package-data]
protocol = ["schema/*.json"]
"companion.application" = ["*.yaml"]
"companion.psychology.exercises" = ["*.yaml"]
"companion.psychology.safety" = ["*.yaml"]
"companion.psychology.sources" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
