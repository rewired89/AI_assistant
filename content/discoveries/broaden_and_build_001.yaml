id: broaden_and_build_001
topic: resilience_and_adaptation
title: What good feelings can open up
hook: Do good feelings only feel nice, or can they also help in lasting ways?
researcher: Barbara Fredrickson
publication_year: 2001
source_title: 'The role of positive emotions in positive psychology: The broaden-and-build theory of positive emotions'
source_url: https://pubmed.ncbi.nlm.nih.gov/11315248/
evidence_type: theory
summary: She proposed the broaden-and-build theory. Positive emotions widen the range of thoughts and actions that come to mind in the moment, and over time that helps build lasting personal resources, from physical and intellectual ones to social and psychological ones. The paper also reviewed early evidence for the idea.
limitations: It is a theory with preliminary evidence at the time, and the paper itself points to questions that still needed testing. It does not claim anyone needs to feel positive all the time.
everyday_example: Curiosity or play can open up new ideas, like taking a different route on a walk and noticing a place you would like to come back to.
reflection_question: What is one small good feeling from this week, and what did it make you want to try or notice?
optional_exercise: Notice one moment of interest or fun today and ask yourself what it made you curious about.
