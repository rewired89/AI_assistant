id: emotion_regulation_gross_001
topic: emotional_regulation
title: Five places to steer a feeling
hook: When a feeling shows up, is the only choice to feel it or to push it down?
researcher: James Gross
publication_year: 1998
source_title: 'The emerging field of emotion regulation: An integrative review'
source_url: https://doi.org/10.1037/1089-2680.2.3.271
evidence_type: research_review
summary: 'Gross proposed a process model: an emotion unfolds over time, and there are five points where people can influence it. You can choose the situation, change the situation, decide where to point your attention, change how you think about it, or shape how you respond once the feeling is already there.'
limitations: This is a framework for organizing research, not a prescription. I am not claiming any one of the five is best, since what works depends on the person and the moment.
everyday_example: Say a crowded party makes you tense. You could skip it, arrive early while it is quiet, focus on one friendly face, remind yourself it is only a couple of hours, or step outside to breathe.
reflection_question: When a feeling is big, which of those five places do you tend to reach for first?
optional_exercise: Next time you notice a strong feeling, just name which of the five you used. No need to change anything.
