# Copy to config/companion.yaml and edit. Relative paths are relative to this file.
species: ninetales            # ninetales | cubone
device_id: ninetails-01       # created with: python -m tools.provision create ninetails-01 --url wss://HOST:8443 --ca secrets/tls/ca.pem
user_id: her
timezone: America/New_York    # UNVERIFIED guess from the spec's example; set her real one
data_dir: ../data
secrets: ../secrets/keys.json
tls:
  cert: ../secrets/tls/server.pem
  key: ../secrets/tls/server.key
listen:
  host: 0.0.0.0               # the robot dials this machine over the home network; use 127.0.0.1 for local tests
  port: 8443
stt:
  engine: whisper             # none | whisper (needs: pip install -e ".[stt]" and python -m tools.fetch_models)
  model: ../models/whisper-base.en   # measured on a Ryzen 5 3500U: base.en RTF 0.2, small.en RTF 1.2 (too slow)
tts:
  engine: espeak              # none | espeak (needs espeak-ng installed)
llm:
  engine: ollama              # none | ollama (home-network addresses only unless allow_remote: true)
  url: http://192.168.1.50:11434   # the Minisforum's address; Ollama does NOT run on the laptop
  model: llama3.2:3b          # must be pulled ON that server; check with: python -m tools.check_llm --config config/companion.yaml
memory:
  encrypt: false              # true needs passphrase_env, the NAME of an env var holding the passphrase
  passphrase_env: NINETAILS_MEMORY_PASSPHRASE
